name: Cron — tareas programadas de OmniTech-Core

# DESACTIVADO (ago 2026) — este workflow está deshabilitado manualmente en
# GitHub (Settings → Actions → este workflow → "Disable workflow"), no
# borrado, por si en el futuro se vuelve a necesitar.
#
# Motivo: se construyó pensando en un hosting serverless (Vercel), donde el
# proceso no vive para siempre y algo EXTERNO tiene que disparar las tareas
# programadas. Tras migrar el backend a Render (proceso persistente, igual
# que Replit), el cron interno original (node-cron dentro de src/index.ts —
# recurringInvoiceScheduler, autopilotScheduler, backupEngine) ya cubre esto
# de sobra por sí solo. Tener ambos mecanismos activos a la vez duplicaba
# cada tarea (factura recurrente generada dos veces, etc.) — confirmado en
# los logs de arranque de Render, donde el scheduler interno decía
# "Scheduler started (every 15 min)" mientras este workflow llamaba a la
# misma ruta con la misma frecuencia.
#
# Si en el futuro se vuelve a un hosting serverless, reactivar este workflow
# (y volver a comprobar que las rutas /api/internal/cron/* siguen existiendo
# en el backend).
#
# Sustituye a los node-cron / setInterval que corrían DENTRO del proceso de
# Express en Replit. En un hosting con procesos efímeros (o en frío) el
# proceso no vive para siempre, así que algo EXTERNO tiene que disparar
# estas tareas — ese "algo" es este workflow. Frecuencias:
#   - recurring-invoices : cada 15 minutos (antes: cron.schedule("*/15 * * * *"))
#   - autopilot          : cada 5 minutos  (antes: cron.schedule("* * * * *") —
#                           GitHub Actions no permite más de una vez cada 5
#                           min; "* * * * *" se ignora en silencio, nunca
#                           llegó a dispararse. Confirmado: 0 ejecuciones
#                           registradas mientras estuvo así.)
#   - daily-backup        : una vez al día  (antes: setInterval(..., 24h))
#
# Requiere dos secrets configurados en Settings → Secrets and variables →
# Actions de este repositorio:
#   API_BASE_URL  → URL del backend (Render)
#   CRON_SECRET   → el mismo valor que CRON_SECRET en las variables de
#                   entorno del servicio en Render (ver internalCron.ts)

on:
  schedule:
    - cron: "*/15 * * * *"   # recurring-invoices
    - cron: "*/5 * * * *"    # autopilot
    - cron: "0 3 * * *"      # daily-backup — 03:00 UTC, hora tranquila
  workflow_dispatch: {}       # permite disparo manual desde la pestaña Actions, útil para probar

jobs:
  recurring-invoices:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar recurring-invoices
        run: |
          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${{ secrets.API_BASE_URL }}/api/internal/cron/recurring-invoices" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 30)
          echo "HTTP $http_code"
          cat /tmp/response.txt
          if [ "$http_code" -ge 400 ]; then exit 1; fi

  autopilot:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar autopilot
        run: |
          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${{ secrets.API_BASE_URL }}/api/internal/cron/autopilot" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 30)
          echo "HTTP $http_code"
          cat /tmp/response.txt
          if [ "$http_code" -ge 400 ]; then exit 1; fi

  daily-backup:
    if: github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Disparar daily-backup
        run: |
          http_code=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST \
            "${{ secrets.API_BASE_URL }}/api/internal/cron/daily-backup" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            --max-time 60)
          echo "HTTP $http_code"
          cat /tmp/response.txt
          if [ "$http_code" -ge 400 ]; then exit 1; fi
