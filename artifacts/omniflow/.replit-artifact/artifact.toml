kind = "web"
previewPath = "/"
title = "Omniflow CRM"
version = "1.0.0"
id = "artifacts/omniflow"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23312

[services.development]
run = "pnpm --filter @workspace/omniflow run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/omniflow", "run", "build" ]
publicDir = "artifacts/omniflow/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23312"
BASE_PATH = "/"
